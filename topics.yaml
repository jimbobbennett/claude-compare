# Topics for the Opus 5 vs Opus 5.5 style comparison.
#
# Two axes are spread deliberately, because either could confound a style
# measurement:
#
#   genre  - stylistic tics surface unevenly across registers, so a set that is
#            all technical explainers would misrepresent the effect.
#   domain - an AI-only set cannot distinguish "this model's voice" from "how
#            anything writes about dense technical material". Lifestyle prose
#            gives the constructions room to appear.
#
# Adding a topic here does not invalidate existing briefs: the writer prompt is
# built from the topic string alone, so hashes for other topics are unchanged.

