[project]
name = "claude-compare"
version = "0.1.0"
description = "Opus 5 vs Opus 5.5 blog-writing style comparison, traced in Arize AX"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.7.0",
    "arize-otel>=0.13.0",
    "openinference-instrumentation>=0.1.0",
    "openinference-instrumentation-anthropic>=2.1.5",
    "openinference-semantic-conventions>=0.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
blogwriter = "blogwriter.cli:main"
blogwriter-batch = "blogwriter.batch:main"
blogwriter-research = "blogwriter.research:main"
blogwriter-scan = "blogwriter.scan:main"
blogwriter-ax-report = "blogwriter.ax_report:main"
blogwriter-destyle = "blogwriter.destyle:main"
blogwriter-merge = "blogwriter.merge_rewrites:main"
blogwriter-validate = "blogwriter.validate:main"
blogwriter-judge = "blogwriter.judge:main"
blogwriter-ax-experiments = "blogwriter.ax_experiments:main"
blogwriter-eval-server = "blogwriter.eval_server:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.14",
]
# The remote evaluator (blogwriter-eval-server). Not needed for the harness.
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blogwriter"]

[tool.ruff]
line-length = 88
target-version = "py312"
# ax/ holds the two halves of the AX code evaluator, which the platform
# requires as separate --imports and --code blocks. Neither file is valid
# Python on its own, so linting them only produces false positives.
extend-exclude = ["ax"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # The report deliberately builds strings with ANSI escapes; f-strings in
    # logging-style calls are not a concern here.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# judge_spec.py contains the AX judge prompt verbatim. Its lines must match the
# deployed template byte for byte, so they cannot be wrapped to fit 88 columns.
"src/blogwriter/judge_spec.py" = ["E501"]
